# application-docker.yml — perfil 'docker'. Se activa con SPRING_PROFILES_ACTIVE=docker,
# que el compose inyecta en el servicio 'api'. Apunta a la Postgres del compose.
#
# Spring carga application.yml SIEMPRE y este archivo ENCIMA: solo sobreescribe lo que declara aquí;
# el resto (server.port, jwt.expiration-ms, open-in-view...) se HEREDA del application.yml default.
#
# Perfiles del proyecto (ninguno pisa al otro):
#   dev    = el default (application.yml, H2 en ARCHIVO)            — desarrollo sin levantar nada
#   docker = ESTE (Postgres del compose)                            — paridad con producción
#   test   = application-test.yml (H2 en MEMORIA)                   — la suite de tests
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:taskflow}   # defaults = compose ('db':5432/taskflow); otro Postgres se alcanza cambiando SOLO DB_HOST/DB_PORT/DB_NAME
    username: ${DB_USER}                       # 12-factor: el ambiente inyecta; el yml documenta
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update    # dev con Docker; producción: validate + migraciones (Flyway)
    show-sql: true        # visible en desarrollo; en prod se apaga
  h2:
    console:
      enabled: false      # en este perfil no hay H2 que consolear
jwt:
  secret: ${JWT_SECRET}   # el secret vive en el ambiente, no en el yml
