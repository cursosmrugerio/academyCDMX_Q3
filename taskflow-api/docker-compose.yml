# docker-compose.yml canónico de TaskFlow (S3D2, PM-1) — api + Postgres.
#
# UN yml declarativo describe N contenedores; 'docker compose up -d --build' los
# levanta a todos, en su red, con su volumen. Sustituye a N 'docker run' a mano.
#
# La RED implícita: compose crea una red donde cada servicio es alcanzable por su
# NOMBRE. Por eso la API llega a Postgres con el host 'db' (NO 'localhost': dentro
# del contenedor 'api', localhost es el propio 'api'). Esa es la mitad que faltaba
# de la caja negra del 'docker run' de S2D4.
#
# 12-factor (factor III): NINGÚN secreto vive aquí. Todo llega por variables desde
# un .env local que NO se commitea (.gitignore lo cubre); .env.example documenta
# qué variables existen, sin valores reales.
services:
  api:
    build: .                       # construye la imagen desde el Dockerfile de esta carpeta
    image: taskflow-api            # nombra la imagen (sin esto sería '<carpeta>-api');
                                   # cumple el Contrato con D3/D4 (imagen 'taskflow-api')
    ports:
      - "8080:8080"                # publica el puerto de la API hacia tu host (Swagger)
    environment:
      SPRING_PROFILES_ACTIVE: docker     # activa application-docker.yml (Postgres)
      DB_USER: ${POSTGRES_USER:-taskflow}          # el yml documenta ${DB_USER}; aquí se inyecta
      DB_PASSWORD: ${POSTGRES_PASSWORD:-taskflow}
      # El secret por AMBIENTE, no quemado en el jar. El valor de despues de ':-' es el
      # de desarrollo: existe para que 'docker compose up' arranque sin configurar nada.
      # Cualquier uso real lo sobreescribe con un .env (o con la variable del sistema).
      JWT_SECRET: ${JWT_SECRET:-cambiame-en-produccion-taskflow-jwt-secret-de-64-caracteres-min!}
      # DB_HOST/DB_PORT/DB_NAME NO se ponen: los defaults del yml (db:5432/taskflow)
      # ya apuntan a este compose. Definirlos es lo unico que hace falta para mandar
      # la MISMA imagen contra otro Postgres, sin recompilar nada.
    depends_on:
      db:
        condition: service_healthy   # espera a que 'db' esté LISTA (no solo arrancada):
                                     # sin esto la API le gana la carrera a Postgres (Error #3)
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow}
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
    ports:
      - "5432:5432"                  # SOLO para inspección desde el host (psql/DBeaver);
                                     # entre contenedores no hace falta publicar nada
    volumes:
      - pgdata:/var/lib/postgresql/data   # el estado de Postgres vive en el volumen, no en el contenedor
    healthcheck:
      # pg_isready responde OK cuando Postgres ACEPTA conexiones (no solo cuando el proceso arrancó)
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskflow} -d ${POSTGRES_DB:-taskflow}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:      # volumen CON NOMBRE: los datos sobreviven a 'down'/'up'.
               # OJO: 'down -v' SÍ lo borra (a conciencia, nunca por reflejo).
